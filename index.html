<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="auth-card">
            <div class="logo">MS</div>
            <h1>Добро пожаловать</h1>
            <p class="subtitle">Войдите или создайте аккаунт для просмотра портфолио</p>

            <div id="normalState">
                <form id="loginForm">
                    <div class="field">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="example@gmail.com">
                        <span class="error" id="loginEmailError"></span>
                    </div>

                    <div class="field">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" placeholder="Минимум 6 символов">
                        <span class="error" id="loginPasswordError"></span>
                    </div>

                    <button class="primary-button" type="submit">Войти</button>
                </form>

                <div class="line">
                    <span></span>
                    <p>или</p>
                    <span></span>
                </div>

                <button class="secondary-button" id="openRegister" type="button">Создать аккаунт</button>
            </div>

            <div class="registered-state" id="registeredState">
                <p>Вы уже зарегистрированы</p>
                <p class="saved-user" id="savedUser"></p>
                <button class="primary-button" id="openPortfolio" type="button">Открыть портфолио</button>
            </div>
        </section>
    </main>

    <div class="modal" id="registerModal">
        <section class="modal-window">
            <button class="close-button" id="closeRegister" type="button">×</button>
            <div class="small-logo">MS</div>
            <h2>Регистрация</h2>
            <p class="modal-subtitle">Заполните данные для создания аккаунта</p>

            <form id="registerForm" method="POST" action="./register">
                <div class="field">
                    <label for="name">Имя</label>
                    <input type="text" id="name" name="name" placeholder="Ваше имя">
                    <span class="error" id="nameError"></span>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="field">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Минимум 6 символов">
                    <span class="error" id="passwordError"></span>
                </div>

                <div class="field">
                    <label for="confirmPassword">Повтор пароля</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль">
                    <span class="error" id="confirmPasswordError"></span>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="agreement" name="agreement">
                    <label for="agreement">Я согласен с условиями регистрации</label>
                </div>
                <span class="error checkbox-error" id="agreementError"></span>

                <button class="primary-button" type="submit">Зарегистрироваться</button>
            </form>

            <p class="status-message" id="registerStatus"></p>
        </section>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
